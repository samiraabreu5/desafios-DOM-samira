<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avô {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pai {
            width: 100px;
            height: 100px;
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .filho {
            width: 50px;
            height: 50px;
            background-color: aquamarine;
            
        }
    </style>
</head>

<body>
    <div class="avô">
        <div class="pai">
            <div class="filho">
            </div>
        </div>
    </div>
</body>
<script>
    let filho = document.querySelector('.filho')
    filho.parentNode.parentNode.style.backgroundColor = 'green'

</script>

</html>
